name: release-annotate

on:
  workflow_dispatch:
    inputs:
      train_manifest_url:
        description: "训练清单 URL/仓库路径（每行: audio, feed, episode）"
        required: true
        default: "https://raw.githubusercontent.com/lzo-noth/DAIE/main/datasets/release_train_manifest.jsonl"
      blind_manifest_url:
        description: "盲测清单 URL/仓库路径（每行: audio, feed, episode）"
        required: true
        default: "https://raw.githubusercontent.com/lzo-noth/DAIE/main/datasets/release_blind_manifest.jsonl"
      whisper_model:
        description: "faster-whisper 模型"
        required: false
        default: "base.en"
      language:
        description: "转写语言"
        required: false
        default: "en"
      llm_model:
        description: "LLM 模型（留空则自动探测可用模型）"
        required: false
        default: ""
      llm_provider:
        description: "LLM 提供方：auto（优先 Gemini）/ gemini / openai；auto 不会在配额耗尽后自动切换，失败后需手动改这里重跑"
        required: false
        default: "auto"
      labels_source:
        description: "标签来源（llm_weak 待人工校对；人工改完后填 human）"
        required: false
        default: "llm_weak"
      batch_size:
        description: "LLM 每批片段数"
        required: false
        default: "40"
      request_interval:
        description: "LLM 批次间隔秒数（限速）"
        required: false
        default: "5"
      shard_count:
        description: "并行分片数（每片约 12-15 集）"
        required: false
        default: "1"
      resume_run_id:
        description: "复用该 run 的 artifact（已完成集/快照/转写）继续跑，可留空"
        required: false
        default: ""
      snapshot_tag:
        description: "训练音频快照归档到的 Release tag（内容寻址，不覆盖）"
        required: false
        default: "audio-snapshots"

permissions:
  contents: write
  actions: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        env:
          N: ${{ inputs.shard_count }}
        run: |
          shards=$(python -c 'import json,os;print(json.dumps(list(range(1,int(os.environ["N"])+1))))')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  annotate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet numpy openai faster-whisper "av<14"
      - name: Seed annotation cache from repo dataset
        run: |
          set -euo pipefail
          mkdir -p out/release
          if [ -d datasets/release_annotations ]; then
            for name in annotations.jsonl transcripts.jsonl blind_annotations.jsonl \
                        blind_transcripts.jsonl blind_generated.jsonl; do
              [ -f "datasets/release_annotations/$name" ] && cp "datasets/release_annotations/$name" "out/release/$name"
            done
            if [ -d datasets/release_annotations/blind_gt ]; then
              mkdir -p out/release/blind_gt
              cp datasets/release_annotations/blind_gt/*.json out/release/blind_gt/ 2>/dev/null || true
            fi
          fi
          wc -l out/release/*.jsonl 2>/dev/null || true
      - name: Restore partial annotation output from previous run
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p out/base
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | test("^(dai-release-annotations-[0-9]+$|dai-release-pipeline-)")) | .name' \
            | tail -1)
          if [ -z "$name" ]; then
            echo "run $RESUME_RUN 没有可复用的标注 artifact" >&2
            exit 1
          fi
          gh run download "$RESUME_RUN" -n "$name" -D out/base --repo "$GITHUB_REPOSITORY"
          mkdir -p out/release
          if [ -d out/base/snapshots ]; then
            cp -r out/base/snapshots out/release/
          fi
          if [ -d out/base/blind_snapshots ]; then
            cp -r out/base/blind_snapshots out/release/
          fi
          ls -la out/base | head -40
      - name: Fetch release manifests
        env:
          TRAIN_URL: ${{ inputs.train_manifest_url }}
          BLIND_URL: ${{ inputs.blind_manifest_url }}
        run: |
          set -euo pipefail
          mkdir -p out/release
          if [[ "$TRAIN_URL" == http* ]]; then curl -fsSL "$TRAIN_URL" -o out/release/train_manifest.jsonl; else cp "$TRAIN_URL" out/release/train_manifest.jsonl; fi
          if [[ "$BLIND_URL" == http* ]]; then curl -fsSL "$BLIND_URL" -o out/release/blind_manifest.jsonl; else cp "$BLIND_URL" out/release/blind_manifest.jsonl; fi
      - name: Filter resumed cache to the current manifests
        if: inputs.resume_run_id != ''
        run: |
          set -euo pipefail
          python scripts/seed_annotation_cache.py \
            --base-dir out/base \
            --out-dir out/release \
            --train-manifest out/release/train_manifest.jsonl \
            --blind-manifest out/release/blind_manifest.jsonl
      - name: Pick available LLM model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ inputs.llm_model }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/annotate_release_episodes.py --pick-model \
              --provider "$LLM_PROVIDER" --model "$LLM_MODEL" | tee pick_model.log; then
              break
            fi
            echo "model probe failed (attempt $attempt)"
            sleep $((attempt * 60))
          done
          model=$(grep '^MODEL=' pick_model.log | tail -1 | cut -d= -f2)
          test -n "$model"
          echo "LLM_MODEL=$model" >> "$GITHUB_ENV"
      - name: Transcribe and LLM-annotate training audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          LANGUAGE: ${{ inputs.language }}
          LABELS_SOURCE: ${{ inputs.labels_source }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          REQUEST_INTERVAL: ${{ inputs.request_interval }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}
        run: |
          set -euo pipefail
          python scripts/annotate_release_episodes.py \
            --manifest out/release/train_manifest.jsonl \
            --annotations-out out/release/annotations.jsonl \
            --transcripts-out out/release/transcripts.jsonl \
            --snapshot-dir out/release/snapshots \
            --whisper-model "$WHISPER_MODEL" --language "$LANGUAGE" \
            --model "$LLM_MODEL" --provider "$LLM_PROVIDER" \
            --labels-source "$LABELS_SOURCE" --allow-empty-ads \
            --batch-size "$BATCH_SIZE" --request-interval "$REQUEST_INTERVAL" \
            --shard-index "$((SHARD_INDEX - 1))" --shard-count "$SHARD_COUNT" \
            --resume
      - name: Transcribe and LLM-annotate blind audio ground truth
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          LANGUAGE: ${{ inputs.language }}
          LABELS_SOURCE: ${{ inputs.labels_source }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          REQUEST_INTERVAL: ${{ inputs.request_interval }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}
        run: |
          set -euo pipefail
          python scripts/annotate_release_episodes.py \
            --manifest out/release/blind_manifest.jsonl \
            --annotations-out out/release/blind_annotations.jsonl \
            --transcripts-out out/release/blind_transcripts.jsonl \
            --snapshot-dir out/release/blind_snapshots \
            --ground-truth-dir out/release/blind_gt \
            --blind-manifest-out out/release/blind_generated.jsonl \
            --whisper-model "$WHISPER_MODEL" --language "$LANGUAGE" \
            --model "$LLM_MODEL" --provider "$LLM_PROVIDER" \
            --labels-source "$LABELS_SOURCE" --allow-empty-ads \
            --batch-size "$BATCH_SIZE" --request-interval "$REQUEST_INTERVAL" \
            --shard-index "$((SHARD_INDEX - 1))" --shard-count "$SHARD_COUNT" \
            --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dai-release-annotations-${{ github.run_number }}-shard${{ matrix.shard }}
          path: out/release/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: annotate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download base and shard artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p out/shards
          if [ -n "$RESUME_RUN" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts" \
              --jq '.artifacts[] | select(.name | test("^(dai-release-annotations-[0-9]+$|dai-release-pipeline-)")) | .name' \
              | tail -1)
            if [ -n "$base" ]; then
              gh run download "$RESUME_RUN" -n "$base" -D out/base --repo "$GITHUB_REPOSITORY"
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | contains("-shard")) | .name' \
            > shard_names.txt
          test -s shard_names.txt
          i=0
          while read -r name; do
            i=$((i + 1))
            gh run download "$GITHUB_RUN_ID" -n "$name" -D "out/shards/shard-$i" --repo "$GITHUB_REPOSITORY"
          done < shard_names.txt
          ls -la out/shards | head -20
      - name: Merge shards
        run: |
          set -euo pipefail
          inputs=()
          if [ -d out/base ]; then
            inputs+=(--input out/base)
          fi
          for dir in out/shards/shard-*; do
            if [ -d "$dir" ]; then
              inputs+=(--input "$dir")
            fi
          done
          python scripts/merge_release_shards.py "${inputs[@]}" --out-dir out/release
      - name: Fetch release manifests for coverage gate
        env:
          TRAIN_URL: ${{ inputs.train_manifest_url }}
          BLIND_URL: ${{ inputs.blind_manifest_url }}
        run: |
          set -euo pipefail
          mkdir -p out/gate
          if [[ "$TRAIN_URL" == http* ]]; then curl -fsSL "$TRAIN_URL" -o out/gate/train_manifest.jsonl; else cp "$TRAIN_URL" out/gate/train_manifest.jsonl; fi
          if [[ "$BLIND_URL" == http* ]]; then curl -fsSL "$BLIND_URL" -o out/gate/blind_manifest.jsonl; else cp "$BLIND_URL" out/gate/blind_manifest.jsonl; fi
      - name: Enforce manifest coverage
        run: |
          set -euo pipefail
          coverage_args=()
          for dir in out/shards/shard-*; do
            if [ -d "$dir" ]; then
              coverage_args+=(--coverage-dir "$dir")
            fi
          done
          python scripts/verify_release_coverage.py \
            --train-manifest out/gate/train_manifest.jsonl \
            --blind-manifest out/gate/blind_manifest.jsonl \
            --data-dir out/release \
            "${coverage_args[@]}" \
            --out out/release/release_coverage.json
      - name: Archive training audio snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: |
          set -euo pipefail
          python scripts/archive_snapshots.py \
            --dir out/release/snapshots \
            --tag "$SNAPSHOT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --index-out out/release/snapshot_archive.json
      - name: Apply label review decisions
        run: |
          set -euo pipefail
          if [ -f datasets/release_annotations/review_decisions.json ]; then
            python scripts/apply_review_decisions.py \
              --data-dir out/release \
              --decisions datasets/release_annotations/review_decisions.json
          else
            echo "no review decisions, keeping raw LLM labels"
          fi
      - name: Publish annotation data to repo
        run: |
          set -euo pipefail
          python scripts/publish_annotation_data.py \
            --source out/release \
            --dest datasets/release_annotations \
            --run-id "$GITHUB_RUN_ID"
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/release_annotations
          if git diff --cached --quiet; then
            echo "annotation data unchanged"
            exit 0
          fi
          git commit -m "Update release annotation data (run $GITHUB_RUN_ID)"
          git push || { git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }
      - uses: actions/upload-artifact@v4
        with:
          name: dai-release-annotations-${{ github.run_number }}
          path: out/release/
          if-no-files-found: warn
          retention-days: 30
