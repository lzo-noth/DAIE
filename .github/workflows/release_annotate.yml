name: release-annotate

on:
  workflow_dispatch:
    inputs:
      train_manifest_url:
        description: "训练清单 URL/仓库路径（每行: audio, feed, episode）"
        required: true
        default: "https://raw.githubusercontent.com/lzo-noth/DAIE/main/datasets/release_train_manifest.jsonl"
      blind_manifest_url:
        description: "盲测清单 URL/仓库路径（每行: audio, feed, episode）"
        required: true
        default: "https://raw.githubusercontent.com/lzo-noth/DAIE/main/datasets/release_blind_manifest.jsonl"
      whisper_model:
        description: "faster-whisper 模型"
        required: false
        default: "base.en"
      language:
        description: "转写语言"
        required: false
        default: "en"
      labels_source:
        description: "标签来源（llm_weak 待人工校对；人工改完后填 human）"
        required: false
        default: "llm_weak"
      batch_size:
        description: "LLM 每批片段数"
        required: false
        default: "40"
      request_interval:
        description: "LLM 批次间隔秒数（限速）"
        required: false
        default: "5"
      resume_run_id:
        description: "复用该 run 的 artifact（已完成集/快照/转写）继续跑，可留空"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet numpy faster-whisper "av<14"
      - name: Restore partial annotation output from previous run
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p out/release
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | test("^(dai-release-annotations|dai-release-pipeline)-")) | .name' \
            | head -1)
          if [ -z "$name" ]; then
            echo "run $RESUME_RUN 没有可复用的标注 artifact" >&2
            exit 1
          fi
          gh run download "$RESUME_RUN" -n "$name" -D out/release --repo "$GITHUB_REPOSITORY"
          ls -la out/release | head -40
      - name: Fetch release manifests
        env:
          TRAIN_URL: ${{ inputs.train_manifest_url }}
          BLIND_URL: ${{ inputs.blind_manifest_url }}
        run: |
          set -euo pipefail
          mkdir -p out/release
          if [[ "$TRAIN_URL" == http* ]]; then curl -fsSL "$TRAIN_URL" -o out/release/train_manifest.jsonl; else cp "$TRAIN_URL" out/release/train_manifest.jsonl; fi
          if [[ "$BLIND_URL" == http* ]]; then curl -fsSL "$BLIND_URL" -o out/release/blind_manifest.jsonl; else cp "$BLIND_URL" out/release/blind_manifest.jsonl; fi
      - name: Transcribe and LLM-annotate training audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          LANGUAGE: ${{ inputs.language }}
          LABELS_SOURCE: ${{ inputs.labels_source }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          REQUEST_INTERVAL: ${{ inputs.request_interval }}
        run: |
          set -euo pipefail
          python scripts/annotate_release_episodes.py \
            --manifest out/release/train_manifest.jsonl \
            --annotations-out out/release/annotations.jsonl \
            --transcripts-out out/release/transcripts.jsonl \
            --snapshot-dir out/release/snapshots \
            --whisper-model "$WHISPER_MODEL" --language "$LANGUAGE" \
            --labels-source "$LABELS_SOURCE" --allow-empty-ads \
            --batch-size "$BATCH_SIZE" --request-interval "$REQUEST_INTERVAL" \
            --resume
      - name: Transcribe and LLM-annotate blind audio ground truth
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          LANGUAGE: ${{ inputs.language }}
          LABELS_SOURCE: ${{ inputs.labels_source }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          REQUEST_INTERVAL: ${{ inputs.request_interval }}
        run: |
          set -euo pipefail
          python scripts/annotate_release_episodes.py \
            --manifest out/release/blind_manifest.jsonl \
            --annotations-out out/release/blind_annotations.jsonl \
            --transcripts-out out/release/blind_transcripts.jsonl \
            --snapshot-dir out/release/blind_snapshots \
            --ground-truth-dir out/release/blind_gt \
            --blind-manifest-out out/release/blind_generated.jsonl \
            --whisper-model "$WHISPER_MODEL" --language "$LANGUAGE" \
            --labels-source "$LABELS_SOURCE" --allow-empty-ads \
            --batch-size "$BATCH_SIZE" --request-interval "$REQUEST_INTERVAL" \
            --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dai-release-annotations-${{ github.run_number }}
          path: out/release/
          if-no-files-found: warn
          retention-days: 30
