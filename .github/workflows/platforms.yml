name: platforms

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/platforms.yml"
      - "scripts/**"
      - "dai_detect/**"
      - "calibration.json"
      - "feedback/COMPLETE"
      - "feedback/STOPPED"
  schedule:
    # 每天一轮：检测 -> ASR/LLM 标注 -> 拟合校准 -> 提交，下一轮自动生效。
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      episodes:
        description: "每个 feed 分析最新几集（重复广告需要至少 2 集）"
        required: false
        default: "2"
      min_score:
        description: "最低候选分数"
        required: false
        default: "0.5"
      min_run:
        description: "重复区间最短秒数"
        required: false
        default: "8"
      platform:
        description: "只跑名称包含该子串的平台（可选）"
        required: false
        default: ""
      feed:
        description: "只跑名称或 slug 包含该子串的 feed（可选）"
        required: false
        default: ""
      feeds:
        description: "只跑这些 feed slug/名称子串，逗号分隔（可选）"
        required: false
        default: ""
      max_parallel:
        description: "analyze 并发 job 数"
        required: false
        default: "16"
      max_rounds:
        description: "自我改进最大轮数"
        required: false
        default: "10"
      target_precision:
        description: "可选：预复核 precision 门限；0 表示不限制（LLM 复核负责最终精度）"
        required: false
        default: "0"
      target_recall:
        description: "达到高可用的最低 candidate recall"
        required: false
        default: "0.8"
      target_recall_at:
        description: "top-K 候选召回率门限"
        required: false
        default: "0.95"
      target_recall_at_k:
        description: "top-K 的 K"
        required: false
        default: "40"
      target_auc:
        description: "达到高可用的最低 AUC"
        required: false
        default: "0.8"
      target_fp_per_hour:
        description: "每小时最多预复核误报候选数"
        required: false
        default: "15"
      target_candidates_per_hour:
        description: "每小时最多送 LLM 复核的候选数"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: dai-self-improve
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      round: ${{ steps.check.outputs.round }}
      max_rounds: ${{ steps.check.outputs.max_rounds }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          MAX_ROUNDS_INPUT: ${{ inputs.max_rounds }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          feedback = pathlib.Path("feedback")
          state = {}
          try:
              state = json.loads((feedback / "state.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              pass
          marker = feedback / "COMPLETE"
          stopped_marker = feedback / "STOPPED"
          current = int(state.get("round") or 0)
          max_rounds = int(os.environ.get("MAX_ROUNDS_INPUT") or state.get("max_rounds") or 10)
          if marker.exists() or stopped_marker.exists():
              print("run=false")
              print("round=" + str(current))
              print("max_rounds=" + str(max_rounds))
              active = marker if marker.exists() else stopped_marker
              print(f"::notice::loop stopped: {active.read_text(encoding='utf-8').strip()}")
          elif state.get("stopped"):
              print("run=false")
              print("round=" + str(current))
              print("max_rounds=" + str(max_rounds))
              print("::notice::loop stopped at max rounds")
          elif current >= max_rounds:
              print("run=false")
              print("round=" + str(current))
              print("max_rounds=" + str(max_rounds))
              print("::notice::max rounds reached")
          else:
              print("run=true")
              print("round=" + str(current + 1))
              print("max_rounds=" + str(max_rounds))
          PY

  setup:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: analysis-venv
        with:
          path: .venv-analysis
          key: dai-analysis-venv-v2
      - name: Prepare analysis venv
        if: steps.analysis-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-analysis
          .venv-analysis/bin/python -m pip install --quiet numpy imageio-ffmpeg
      - id: matrix
        env:
          PLATFORM_FILTER: ${{ inputs.platform }}
          FEED_FILTER: ${{ inputs.feed }}
          FEEDS_FILTER: ${{ inputs.feeds }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data = json.load(open("platforms.json", encoding="utf-8"))
          needle = (os.environ.get("PLATFORM_FILTER") or "").strip().lower()
          feed_needle = (os.environ.get("FEED_FILTER") or "").strip().lower()
          feeds_needles = [n.strip().lower() for n in (os.environ.get("FEEDS_FILTER") or "").split(",") if n.strip()]
          entries = []
          for platform in data:
              if needle and needle not in (platform.get("platform") or "").lower():
                  continue
              for feed in platform.get("feeds", []):
                  haystack = f"{feed.get('slug', '')} {feed.get('name', '')}".lower()
                  if feed_needle and feed_needle not in haystack:
                      continue
                  if feeds_needles and not any(n in haystack for n in feeds_needles):
                      continue
                  entries.append({
                      "platform": platform["platform"],
                      "feed": feed["name"],
                      "slug": feed["slug"],
                      "url": feed["url"],
                      "optional": bool(feed.get("optional", False)),
                  })
          print("matrix=" + json.dumps({"include": entries}))
          PY

  verify:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy
      - name: Verify feeds
        run: |
          mkdir -p out
          python -m dai_detect verify platforms.json --report out/feed_verification.json | tee out/verify.log
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-verification
          path: out/
          if-no-files-found: warn

  analyze:
    needs: [gate, setup]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '16') }}
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .venv-analysis
          key: dai-analysis-venv-v2
      - name: Ensure analysis environment
        run: |
          if [ ! -x .venv-analysis/bin/python ]; then
            python -m venv .venv-analysis
            .venv-analysis/bin/python -m pip install --quiet numpy imageio-ffmpeg
          fi
      - name: Analyze ${{ matrix.platform }} / ${{ matrix.feed }}
        env:
          EPISODES: ${{ inputs.episodes || '2' }}
          MIN_SCORE: ${{ inputs.min_score || '0.5' }}
          MIN_RUN: ${{ inputs.min_run || '8' }}
        run: |
          mkdir -p "out/${{ matrix.slug }}"
          set -o pipefail
          .venv-analysis/bin/python -m dai_detect feed "${{ matrix.url }}" \
            -n "$EPISODES" \
            --min-score "$MIN_SCORE" \
            --min-run "$MIN_RUN" \
            --fresh \
            --cache-dir "$RUNNER_TEMP/dai-cache" \
            --clips-dir "out/${{ matrix.slug }}/clips" \
            --clip-seconds 30 \
            --report "out/${{ matrix.slug }}/report.json" 2>&1 | tee "out/${{ matrix.slug }}/run.log"
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai-${{ matrix.slug }}
          path: out/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 30

  asr-llm:
    needs: [gate, analyze]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: venv
        with:
          path: |
            .venv
            ~/.cache/huggingface
          key: dai-venv-py312-v4
      - name: Prepare ASR/LLM environment
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet numpy faster-whisper openai imageio-ffmpeg
          .venv/bin/python - <<'PY'
          from faster_whisper import WhisperModel
          WhisperModel("base.en", device="cpu", compute_type="int8")
          PY
      - name: Download analysis artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: analysis
          pattern: dai-*
          merge-multiple: false
      - name: Transcribe and classify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -d analysis ]; then
            set -o pipefail
            .venv/bin/python scripts/asr_clips.py --reports-root analysis --model base.en --language en
            if [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
              .venv/bin/python scripts/classify_ads.py --reports-root analysis
            fi
          else
            echo "No analysis artifacts to enrich"
          fi
      - name: Upload enriched reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-results
          path: analysis/
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: [gate, analyze, verify, asr-llm]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download enriched results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: asr-results
          path: enriched
      - name: Download analysis fallback
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dai-*
          merge-multiple: false
      - name: Download feed verification
        uses: actions/download-artifact@v4
        with:
          name: feed-verification
          path: artifacts/feed-verification
      - name: Build summary
        run: |
          mkdir -p out/summary
          python - <<'PY'
          import json, pathlib
          platforms = json.load(open("platforms.json", encoding="utf-8"))
          meta = {
              feed["slug"]: (platform["platform"], feed["name"])
              for platform in platforms
              for feed in platform.get("feeds", [])
          }
          enriched = pathlib.Path("enriched")
          root = enriched if any(enriched.glob("dai-*")) else pathlib.Path("artifacts")
          feeds = []
          for directory in sorted(root.glob("dai-*")):
              slug = directory.name[len("dai-"):]
              platform, feed = meta.get(slug, (slug, ""))
              entry = {"slug": slug, "platform": platform, "feed": feed}
              report_path = directory / "report.json"
              if report_path.exists():
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  episodes = report.get("episodes", [])
                  candidates = [c for episode in episodes for c in episode.get("candidates", [])]
                  entry.update({
                      "title": report.get("feed", {}).get("title"),
                      "episodes": len(episodes),
                      "failed": sum(1 for episode in episodes if episode.get("error")),
                      "candidates": len(candidates),
                      "repeated": sum(1 for c in candidates if c.get("tier") == "repeated"),
                      "inserted": sum(1 for c in candidates if c.get("tier") == "inserted"),
                      "inserted_slot": sum(
                          1 for c in candidates
                          if c.get("tier") == "inserted" and c.get("evidence", {}).get("slot_matches")
                      ),
                      "ad_language": sum(
                          1 for c in candidates if c.get("evidence", {}).get("ad_language")
                      ),
                      "llm_ads": sum(
                          1 for c in candidates if c.get("evidence", {}).get("llm_verified")
                      ),
                      "top": [
                          {
                              "episode": episode.get("title"),
                              "start": c.get("start"),
                              "end": c.get("end"),
                              "tier": c.get("tier"),
                              "score": c.get("score"),
                              "slot_matches": c.get("evidence", {}).get("slot_matches"),
                              "clip": c.get("evidence", {}).get("clip"),
                              "ad_language": c.get("evidence", {}).get("ad_language"),
                              "ad_terms": c.get("evidence", {}).get("ad_terms"),
                              "llm_verified": c.get("evidence", {}).get("llm_verified"),
                              "llm_brand": (c.get("evidence", {}).get("llm") or {}).get("brand"),
                              "learned_ad_score": c.get("evidence", {}).get("learned_ad_score"),
                          }
                          for episode in episodes
                          for c in episode.get("candidates", [])
                      ][:8],
                  })
              else:
                  entry["error"] = "missing report.json"
              feeds.append(entry)
          verification = None
          verification_path = pathlib.Path("artifacts/feed-verification/feed_verification.json")
          if verification_path.exists():
              verification = json.loads(verification_path.read_text(encoding="utf-8"))
          summary = {"feeds": feeds, "verification": verification}
          pathlib.Path("out/summary/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          lines = ["# DAI platform matrix", "", "| Platform | Feed | Episodes | Repeated | Inserted | Slot-confirmed | Ad-language | LLM ads | Failed | Top |",
                   "|---|---|---:|---:|---:|---:|---:|---:|---:|---|"]
          for entry in feeds:
              top = entry.get("top", [{}])[0] if entry.get("top") else {}
              top_text = f"{top.get('start')}–{top.get('end')} ({top.get('tier')}, {top.get('score')})" if top else "-"
              lines.append(
                  f"| {entry.get('platform')} | {entry.get('feed')} | {entry.get('episodes', 0)} | "
                  f"{entry.get('repeated', 0)} | {entry.get('inserted', 0)} | {entry.get('inserted_slot', 0)} | "
                  f"{entry.get('ad_language', 0)} | {entry.get('llm_ads', 0)} | {entry.get('failed', 0)} | {top_text} |"
              )
          pathlib.Path("out/summary/summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat out/summary/summary.md
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai-matrix-summary
          path: out/summary/
          if-no-files-found: warn

  learn:
    needs: [gate, asr-llm]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ROUND: ${{ needs.gate.outputs.round }}
      MAX_ROUNDS: ${{ needs.gate.outputs.max_rounds }}
      TARGET_PRECISION: ${{ inputs.target_precision }}
      TARGET_RECALL: ${{ inputs.target_recall }}
      TARGET_RECALL_AT: ${{ inputs.target_recall_at }}
      TARGET_RECALL_AT_K: ${{ inputs.target_recall_at_k }}
      TARGET_AUC: ${{ inputs.target_auc }}
      TARGET_FP_PER_HOUR: ${{ inputs.target_fp_per_hour }}
      TARGET_CANDIDATES_PER_HOUR: ${{ inputs.target_candidates_per_hour }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy
      - name: Download enriched reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: asr-results
          path: analysis
      - name: Collect LLM labels
        run: |
          mkdir -p out/learn
          if [ -d analysis ]; then
            python scripts/collect_labels.py \
              --reports-root analysis \
              --store feedback/labels.jsonl \
              --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          else
            echo "no enriched reports; reusing feedback/labels.jsonl"
          fi
      - name: Mine ad keywords
        run: |
          python scripts/mine_keywords.py \
            --store feedback/labels.jsonl \
            --out feedback/keywords.json
      - name: Evaluate human ground truth
        run: |
          mkdir -p out/learn
          if [ -d ground_truth ] && ls ground_truth/*.json >/dev/null 2>&1; then
            python scripts/evaluate_ground_truth.py \
              --reports-root analysis \
              --ground-truth ground_truth \
              --out out/learn/ground_truth.json || true
          else
            echo "no ground_truth/*.json; event precision, recall and boundary P95 remain unverified"
          fi
      - name: Fit calibration
        run: |
          TARGET_RECALL="${TARGET_RECALL:-0.8}"
          TARGET_RECALL_AT="${TARGET_RECALL_AT:-0.95}"
          TARGET_RECALL_AT_K="${TARGET_RECALL_AT_K:-40}"
          TARGET_AUC="${TARGET_AUC:-0.8}"
          TARGET_FP_PER_HOUR="${TARGET_FP_PER_HOUR:-15}"
          python scripts/fit_calibration.py feedback/labels.jsonl \
            --out calibration.json \
            --mode filter \
            --target-recall "$TARGET_RECALL" \
            --target-recall-at-k "$TARGET_RECALL_AT_K" \
            --target-recall-at "$TARGET_RECALL_AT" \
            --target-auc "$TARGET_AUC" \
            --target-fp-per-hour "$TARGET_FP_PER_HOUR" \
            --metrics-out out/learn/metrics.json || true
      - name: Keep previous calibration if not improved
        run: |
          if [ ! -f calibration.json ]; then
            exit 0
          fi
          ENABLED=$(python -c "import json; print(json.load(open('calibration.json')).get('enabled'))")
          IMPROVED=$(python - <<'PY'
          import json, subprocess
          try:
              new = json.load(open("out/learn/metrics.json", encoding="utf-8"))
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:calibration.json"]).decode("utf-8"))
          except Exception:
              print("yes")
              raise SystemExit
          new_learned = new.get("learned") or {}
          old_learned = ((old.get("metrics") or {}).get("learned")) or {}
          new_auc = float(new_learned.get("auc") or 0.0)
          new_precision = float(new_learned.get("precision") or 0.0)
          old_auc = float(old_learned.get("auc") or 0.0)
          old_precision = float(old_learned.get("precision") or 0.0)
          ok = new_auc >= old_auc - 0.005 and new_precision >= old_precision - 0.02
          print("yes" if ok else "no")
          PY
          )
          if [ "$ENABLED" != "True" ] || [ "$IMPROVED" != "yes" ]; then
            git checkout -- calibration.json || true
            echo "kept previous calibration (new model did not improve AUC/precision)"
          fi
      - name: Update loop state
        run: |
          TARGET_PRECISION="${TARGET_PRECISION:-0}"
          TARGET_RECALL="${TARGET_RECALL:-0.8}"
          TARGET_RECALL_AT="${TARGET_RECALL_AT:-0.95}"
          TARGET_RECALL_AT_K="${TARGET_RECALL_AT_K:-40}"
          TARGET_AUC="${TARGET_AUC:-0.8}"
          TARGET_FP_PER_HOUR="${TARGET_FP_PER_HOUR:-15}"
          TARGET_CANDIDATES_PER_HOUR="${TARGET_CANDIDATES_PER_HOUR:-30}"
          python scripts/update_loop_state.py \
            --metrics out/learn/metrics.json \
            --state feedback/state.json \
            --calibration calibration.json \
            --round "${ROUND:-1}" \
            --max-rounds "${MAX_ROUNDS:-10}" \
            --target-precision "$TARGET_PRECISION" \
            --target-recall "$TARGET_RECALL" \
            --target-recall-at-k "$TARGET_RECALL_AT_K" \
            --target-recall-at "$TARGET_RECALL_AT" \
            --target-auc "$TARGET_AUC" \
            --target-fp-per-hour "$TARGET_FP_PER_HOUR" \
            --target-candidates-per-hour "$TARGET_CANDIDATES_PER_HOUR" \
            --ground-truth-metrics out/learn/ground_truth.json \
            --patience 2 || true
          cat feedback/state.json 2>/dev/null || true
      - name: Commit feedback and calibration
        run: |
          git config user.name "dai-loop"
          git config user.email "dai-loop@users.noreply.github.com"
          git add calibration.json feedback
          if git diff --cached --quiet; then
            echo "no feedback changes"
          else
            git commit -m "chore(loop): round ${ROUND:-1} self-improve calibration [skip ci]"
          fi
      - name: Push feedback
        continue-on-error: true
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload learning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai-learn
          path: |
            out/learn/
            feedback/
            calibration.json
          if-no-files-found: warn
          retention-days: 30
