name: llm-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client
        run: python -m pip install --quiet openai
      - name: Check key and models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out
          python scripts/check_llm.py | tee out/check.log
      - name: Upload check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-check
          path: out/
          if-no-files-found: warn
