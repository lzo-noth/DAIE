name: release-train-blind

on:
  workflow_dispatch:
    inputs:
      annotation_run_id:
        description: "release-annotate 的 run id（提供人工校对后的标注与快照）"
        required: true
      min_events:
        description: "批量盲测最少真值广告数"
        required: false
        default: "10"
      min_feeds:
        description: "批量盲测最少未见 feed 数"
        required: false
        default: "3"
      allow_weak_blind_labels:
        description: "允许 LLM_weak/unverified 真值跑通流程（不会标记性能达标）"
        required: false
        default: "false"
      require_calibrated_models:
        description: "要求模型通过严格校准检查（关闭后仅用于诊断，不会标记达标）"
        required: false
        default: "true"
      models_run_id:
        description: "复用该 run 的已训练模型，跳过训练（仅重跑盲测），可留空"
        required: false
        default: ""
      train_max_episodes:
        description: "只用前 N 集训练（0=全部）；用于诊断训练时长"
        required: false
        default: "0"
      skip_boundary:
        description: "1=训练时跳过边界头（只做窗口诊断，显著更快）"
        required: false
        default: "0"
permissions:
  contents: read
  actions: read

jobs:
  release-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet numpy
      - name: Download annotation artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANNOTATION_RUN: ${{ inputs.annotation_run_id }}
        run: |
          set -euo pipefail
          # 同一 run 里还有 -shard 命名空间的分片产物，只取合并后的整包。
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANNOTATION_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | test("^dai-release-annotations-[0-9]+$")) | .name' \
            | sort -t- -k4 -n | tail -1)
          if [ -z "$name" ]; then
            echo "run $ANNOTATION_RUN 没有 dai-release-annotations artifact" >&2
            exit 1
          fi
          mkdir -p out/release
          gh run download "$ANNOTATION_RUN" -n "$name" -D out/release --repo "$GITHUB_REPOSITORY"
          ls -la out/release | head -40
      - name: Verify annotation inputs
        run: |
          set -euo pipefail
          test -s out/release/annotations.jsonl
          test -s out/release/blind_generated.jsonl
      - name: Reuse models from previous run
        if: inputs.models_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_RUN: ${{ inputs.models_run_id }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MODELS_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("dai-release-blind-")) | .name' \
            | head -1)
          if [ -z "$name" ]; then
            echo "run $MODELS_RUN 没有模型 artifact" >&2
            exit 1
          fi
          mkdir -p out/models
          gh run download "$MODELS_RUN" -n "$name" -D out/models --repo "$GITHUB_REPOSITORY"
          cp out/models/ad_model.json out/release/ad_model.json
          cp out/models/boundary_model.json out/release/boundary_model.json
          ls -la out/release/ad_model.json out/release/boundary_model.json
      - name: Train single-recording models
        if: inputs.models_run_id == ''
        env:
          TRAIN_MAX_EPISODES: ${{ inputs.train_max_episodes }}
          SKIP_BOUNDARY: ${{ inputs.skip_boundary }}
        run: |
          set -euo pipefail
          args=(--annotations out/release/annotations.jsonl
                --model-out out/release/ad_model.json
                --boundary-out out/release/boundary_model.json
                --oof-summary out/release/oof_summary.jsonl
                --outer-folds 6 --inner-folds 4
                --require-ad-type)
          if [ "${TRAIN_MAX_EPISODES:-0}" != "0" ]; then
            args+=(--max-episodes "$TRAIN_MAX_EPISODES")
          fi
          if [ "${SKIP_BOUNDARY:-0}" = "1" ]; then
            args+=(--skip-boundary)
          fi
          python scripts/train_single_episode.py "${args[@]}"
      - name: Blind test release audio batch
        env:
          ALLOW_WEAK: ${{ inputs.allow_weak_blind_labels }}
          MIN_EVENTS: ${{ inputs.min_events }}
          MIN_FEEDS: ${{ inputs.min_feeds }}
          REQUIRE_CALIBRATED: ${{ inputs.require_calibrated_models }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ALLOW_WEAK" = "true" ]; then
            args+=(--allow-nonhuman-ground-truth)
          fi
          strict=()
          if [ "$REQUIRE_CALIBRATED" = "true" ]; then
            strict+=(--require-calibrated-models)
          else
            echo "::warning::跳过严格校准门禁，本次盲测结果仅用于诊断"
          fi
          python scripts/blind_test_batch.py \
            --manifest out/release/blind_generated.jsonl \
            --model out/release/ad_model.json \
            --boundary-model out/release/boundary_model.json \
            --require-models "${strict[@]}" --require-independent-test \
            --min-events "$MIN_EVENTS" --min-feeds "$MIN_FEEDS" \
            "${args[@]}" \
            --reports-out-dir out/release/blind_reports \
            --out out/release/blind_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dai-release-blind-${{ github.run_number }}
          path: out/release/
          if-no-files-found: warn
          retention-days: 30
