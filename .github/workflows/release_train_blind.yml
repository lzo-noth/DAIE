name: release-train-blind

on:
  workflow_dispatch:
    inputs:
      annotation_run_id:
        description: "release-annotate 的 run id（提供人工校对后的标注与快照）"
        required: true
      min_events:
        description: "批量盲测最少真值广告数"
        required: false
        default: "10"
      min_feeds:
        description: "批量盲测最少未见 feed 数"
        required: false
        default: "3"
      allow_weak_blind_labels:
        description: "允许 LLM_weak/unverified 真值跑通流程（不会标记性能达标）"
        required: false
        default: "false"
      require_calibrated_models:
        description: "要求模型通过严格校准检查（关闭后仅用于诊断，不会标记达标）"
        required: false
        default: "true"
      models_run_id:
        description: "复用该 run 的已训练模型，跳过训练（仅重跑盲测），可留空"
        required: false
        default: ""
      train_max_episodes:
        description: "只用前 N 集训练（0=全部）；用于诊断训练时长"
        required: false
        default: "0"
      skip_boundary:
        description: "1=训练时跳过边界头（只做窗口诊断，显著更快）"
        required: false
        default: "0"
      target_scope:
        description: "盲测真值范围：produced=只算预录广告（与正式训练目标一致）；all=全部已标注广告"
        required: false
        default: "produced"
      classifier:
        description: "窗口分类器：logistic（旧基准）或 mlp（探针显示 AUC 0.70→0.93）"
        required: false
        default: "logistic"
      context:
        description: "1=窗口特征拼接 ±4/±12/±30 s 滚动均值（配合 mlp 使用）"
        required: false
        default: "0"
      host_read:
        description: "host_read 处理：negative=hard negative（默认）；ignore=屏蔽（配合内容线索使用）"
        required: false
        default: "negative"
      use_asr:
        description: "1=盲测不用现成转写，改由离线 ASR 生成词级时间（端到端验证）"
        required: false
        default: "0"
      enter_threshold:
        description: "覆盖解码进入阈值（留空=按模型 threshold 推导）"
        required: false
        default: ""
      exit_threshold:
        description: "覆盖解码退出阈值（留空=enter-0.15）"
        required: false
        default: ""
permissions:
  contents: read
  actions: read

jobs:
  release-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet numpy "scikit-learn>=1.3"
      - name: Install offline ASR
        if: inputs.use_asr == '1'
        run: |
          set -euo pipefail
          # 端到端验证：运行时只用这一个固定的离线模型，不联网、不调 LLM。
          python -m pip install --quiet faster-whisper
          python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8'); print('asr ready')"
      - name: Download annotation artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANNOTATION_RUN: ${{ inputs.annotation_run_id }}
        run: |
          set -euo pipefail
          # 同一 run 里还有 -shard 命名空间的分片产物，只取合并后的整包。
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANNOTATION_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | test("^dai-release-annotations-[0-9]+$")) | .name' \
            | sort -t- -k4 -n | tail -1)
          if [ -z "$name" ]; then
            echo "run $ANNOTATION_RUN 没有 dai-release-annotations artifact" >&2
            exit 1
          fi
          mkdir -p out/release
          gh run download "$ANNOTATION_RUN" -n "$name" -D out/release --repo "$GITHUB_REPOSITORY"
          ls -la out/release | head -40
      - name: Verify annotation inputs
        run: |
          set -euo pipefail
          test -s out/release/annotations.jsonl
          test -s out/release/blind_generated.jsonl
      - name: Split ad blocks into sponsor events
        run: |
          set -euo pipefail
          # 训练与盲测必须共用“一条赞助商创意 = 一个事件”的粒度；标注产物里
          # 仍可能是块级区间，这里用转写判定切分，不改音频与推理路径。
          python scripts/split_ad_events.py --data-dir out/release
      - name: Reuse models from previous run
        if: inputs.models_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_RUN: ${{ inputs.models_run_id }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MODELS_RUN/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("dai-release-blind-")) | .name' \
            | head -1)
          if [ -z "$name" ]; then
            echo "run $MODELS_RUN 没有模型 artifact" >&2
            exit 1
          fi
          mkdir -p out/models
          gh run download "$MODELS_RUN" -n "$name" -D out/models --repo "$GITHUB_REPOSITORY"
          cp out/models/ad_model.json out/release/ad_model.json
          cp out/models/boundary_model.json out/release/boundary_model.json
          ls -la out/release/ad_model.json out/release/boundary_model.json
      - name: Verify MLP export
        if: inputs.models_run_id == '' && inputs.classifier == 'mlp'
        run: |
          set -euo pipefail
          # 训练前先验证 sklearn 权重导出与 numpy 前向一致，避免提取 80 分钟后才失败。
          python -m unittest tests.test_mlp_model -v
      - name: Train single-recording models
        if: inputs.models_run_id == ''
        env:
          TRAIN_MAX_EPISODES: ${{ inputs.train_max_episodes }}
          SKIP_BOUNDARY: ${{ inputs.skip_boundary }}
          CLASSIFIER: ${{ inputs.classifier }}
          CONTEXT: ${{ inputs.context }}
          HOST_READ: ${{ inputs.host_read }}
        run: |
          set -euo pipefail
          args=(--annotations out/release/annotations.jsonl
                --transcripts out/release/transcripts.jsonl
                --host-read "$HOST_READ"
                --model-out out/release/ad_model.json
                --boundary-out out/release/boundary_model.json
                --oof-summary out/release/oof_summary.jsonl
                --classifier "$CLASSIFIER"
                --outer-folds 6 --inner-folds 4
                --require-ad-type)
          if [ "${CONTEXT:-0}" = "1" ]; then
            args+=(--context)
          fi
          if [ "${TRAIN_MAX_EPISODES:-0}" != "0" ]; then
            args+=(--max-episodes "$TRAIN_MAX_EPISODES")
          fi
          if [ "${SKIP_BOUNDARY:-0}" = "1" ]; then
            args+=(--skip-boundary)
          fi
          python scripts/train_single_episode.py "${args[@]}"
      - name: Blind test release audio batch
        if: inputs.skip_boundary != '1'
        env:
          ALLOW_WEAK: ${{ inputs.allow_weak_blind_labels }}
          MIN_EVENTS: ${{ inputs.min_events }}
          MIN_FEEDS: ${{ inputs.min_feeds }}
          REQUIRE_CALIBRATED: ${{ inputs.require_calibrated_models }}
          TARGET_SCOPE: ${{ inputs.target_scope }}
          USE_ASR: ${{ inputs.use_asr }}
          ENTER_THRESHOLD: ${{ inputs.enter_threshold }}
          EXIT_THRESHOLD: ${{ inputs.exit_threshold }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ALLOW_WEAK" = "true" ]; then
            args+=(--allow-nonhuman-ground-truth)
          fi
          cues=()
          if [ "${USE_ASR:-0}" = "1" ]; then
            # 端到端验证：词级时间由离线 ASR 从音频现算，不用流水线转写。
            cues+=(--asr)
          else
            cues+=(--transcripts out/release/blind_transcripts.jsonl)
          fi
          strict=()
          if [ "$REQUIRE_CALIBRATED" = "true" ]; then
            strict+=(--require-calibrated-models)
          else
            echo "::warning::跳过严格校准门禁，本次盲测结果仅用于诊断"
          fi
          decoding=()
          if [ -n "${ENTER_THRESHOLD:-}" ]; then
            decoding+=(--enter-threshold "$ENTER_THRESHOLD")
          fi
          if [ -n "${EXIT_THRESHOLD:-}" ]; then
            decoding+=(--exit-threshold "$EXIT_THRESHOLD")
          fi
          python scripts/blind_test_batch.py \
            --manifest out/release/blind_generated.jsonl \
            --model out/release/ad_model.json \
            --boundary-model out/release/boundary_model.json \
            "${cues[@]}" \
            --require-models "${strict[@]}" --require-independent-test \
            --min-events "$MIN_EVENTS" --min-feeds "$MIN_FEEDS" \
            --target-scope "$TARGET_SCOPE" \
            "${decoding[@]}" \
            "${args[@]}" \
            --reports-out-dir out/release/blind_reports \
            --out out/release/blind_summary.json
      - name: Drop audio snapshots before upload
        if: always()
        run: |
          set -euo pipefail
          find out/release -type f \( -name '*.mp3' -o -name '*.m4a' -o -name '*.wav' -o -name '*.opus' \) -delete
          du -sh out/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dai-release-blind-${{ github.run_number }}
          path: out/release/
          if-no-files-found: warn
          retention-days: 30
